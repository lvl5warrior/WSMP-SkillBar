# WSMP-SkillBar configuration
#
# This plugin doesn't add any gameplay of its own — it's a read-only display
# layer that shows each player's level in every installed WSMP skill plugin
# (Mining, Woodcutting, Farming, Fishing, Cooking, Hunter) via a boss bar
# that cycles between them, plus a /skills command for a one-shot full
# breakdown in chat.
#
# It works with any subset of the six plugins installed — a server running
# only WSMP-Mining and WSMP-Fishing will just cycle between those two.

settings:
  # How many seconds the boss bar shows one skill before cycling to the next.
  cycle-seconds: 4
