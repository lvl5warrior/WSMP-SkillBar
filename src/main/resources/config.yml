# SimpleSell Configuration
#
# default-price: this setting is now only a fallback of last resort. Items not explicitly
# priced below automatically get a price based on their rarity tier instead (Trivial,
# Common, Uncommon, Rare, Epic, Legendary - see the rarity-overrides section further down).
# This value is essentially unused now but kept for compatibility.
default-price: 1.0

# Multiplier applied to every sale (1.0 = normal, 0.5 = half price, 2.0 = double price)
# Handy if you want to nerf/buff the whole economy at once without editing every price.
global-multiplier: 1.0

# Items you never want to be sellable (e.g. currency items, quest items, blocks you don't want farmed for cash)
# List the exact Minecraft material name (all caps, underscores)
blacklist:
  - AIR
  - BEDROCK
  - COMMAND_BLOCK
  - BARRIER
  - SPAWNER

# Every item automatically has a leveling system (selling more of it raises its level,
# up to level 99, which gives a small sell-price bonus). How MUCH you need to sell to
# reach level 99 depends on the item's rarity tier - rare items need far less than
# common ones, since they're much harder to obtain in the first place.
#
# Rarity tiers and their approximate level-99 requirement:
#   TRIVIAL   (dirt, cobblestone, logs, etc.)     ~750,000 sold
#   COMMON    (ores, common food, mob drops)      ~60,000 sold
#   UNCOMMON  (ingots, redstone, lapis)           ~12,000 sold
#   RARE      (diamond, emerald, ender pearl)     ~1,800 sold
#   EPIC      (netherite, totems, elytra)         ~180 sold
#   LEGENDARY (dragon egg, nether star)           ~18 sold
#
# Every item is automatically assigned a tier based on how it's normally obtained.
# If you think something got classified wrong, override it here:
# rarity-overrides:
#   DIAMOND_SWORD: RARE
#   SPEAR: EPIC
rarity-overrides: {}

# Milestone announcements - fires when a player hits certain levels on any item.
# Requires DiscordSRV to already be installed and set up on this server for the
# Discord part to work (it uses DiscordSRV's own /discord broadcast command).
discord:
  enabled: true
  # The DiscordSRV channel name to post to (matches a key in DiscordSRV's config.yml "Channels" section)
  channel: global
  # Levels that trigger a Discord shoutout. Level 99 also triggers the server-wide in-game announcement below.
  quarterly-levels: [25, 50, 75, 99]

# Specific prices per item. Anything not listed here uses "default-price" above.
