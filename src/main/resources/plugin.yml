name: WSMP-SkillBar
version: '1.0.0'
main: com.warriorssmp.skillbar.SkillBarPlugin
api-version: '1.21'
author: WarriorsSMP
softdepend: [WSMP-Mining, WSMP-Woodcutting, WSMP-Farming, WSMP-Fishing, WSMP-Cooking, WSMP-Hunter]

commands:
  skillbar:
    description: Toggle the cycling skill-level boss bar on or off
    usage: /skillbar [on|off]
  skills:
    description: Show a full breakdown of all your WSMP skill levels
    aliases: [levels, mylevels]
